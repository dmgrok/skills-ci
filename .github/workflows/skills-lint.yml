name: Skill CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/skills-ci.yml
    with:
      skills-dir: skills
      allowlist: scripts/skills-lint-allowlist.json
