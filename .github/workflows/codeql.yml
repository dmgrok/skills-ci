name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 09:17 UTC. Weekly, and not at the same time as the behavioural job.
    - cron: "17 9 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Python only. This repository has no .js or .ts files, including
      # under tests/fixtures and skills, so javascript-typescript is omitted.
      # build-mode none is the interpreted-language path: init and analyze,
      # with no autobuild step. Shell scripts are not a CodeQL language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
