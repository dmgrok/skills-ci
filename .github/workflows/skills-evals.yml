name: Skill evals

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skills-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Lint and trigger routing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tiers 1 and 2 only. The action runs `skills-evals run` and skips
      # behavioural evals when `behavioral` is empty. No model, no secrets.
      - name: Run skills-evals
        uses: ahnafyy/skills-evals@ef618aabbbd4c03cd7ccc44916f91f320eb389ea # v0.2.0
        with:
          root: .
